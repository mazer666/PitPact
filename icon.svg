<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!--
    PitPact placeholder project icon.
    M0 stand-in: a stylised, dark-mode-friendly seal depicting a parchment
    (the "Pact") over a dark circular pit (the "Pit"). Replace with the
    final art-direction icon as part of the M1 art pass. The current
    palette is intentionally restrained so the icon reads against both
    the light and dark editor themes.
  -->
  <defs>
    <radialGradient id="pitGrad" cx="50%" cy="60%" r="55%">
      <stop offset="0%" stop-color="#1b1410" stop-opacity="1"/>
      <stop offset="60%" stop-color="#0a0807" stop-opacity="1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="parchmentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e9d8a6"/>
      <stop offset="100%" stop-color="#b89968"/>
    </linearGradient>
  </defs>

  <!-- Outer dark circle = the Pit -->
  <circle cx="64" cy="64" r="60" fill="url(#pitGrad)" stroke="#3a2a1a" stroke-width="2"/>

  <!-- Inner ring of light, suggesting depth and a torch at the rim -->
  <circle cx="64" cy="64" r="50" fill="none" stroke="#7a5a2a" stroke-width="1" opacity="0.55"/>

  <!-- The Pact: a stylised rolled scroll with a seal -->
  <g transform="translate(64 64)">
    <!-- scroll body -->
    <rect x="-32" y="-12" width="64" height="24" rx="3" ry="3"
          fill="url(#parchmentGrad)" stroke="#5a3e1a" stroke-width="1.5"/>
    <!-- scroll end caps -->
    <circle cx="-30" cy="0" r="6" fill="#8a6a3a" stroke="#3a2810" stroke-width="1.2"/>
    <circle cx="30"  cy="0" r="6" fill="#8a6a3a" stroke="#3a2810" stroke-width="1.2"/>
    <!-- wax seal -->
    <circle cx="0" cy="0" r="7" fill="#7a1a1a" stroke="#3a0808" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="3" fill="#3a0808"/>
  </g>
</svg>
